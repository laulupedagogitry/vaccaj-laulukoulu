
<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vaccaj – Harjoitus 1a</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 950px;
      margin: 30px auto;
      padding: 20px;
      line-height: 1.6;
    }

    h1 {
      color: #285b99;
    }

    label {
      display: block;
      margin: 20px 0 8px;
    }

    select {
      font-size: 18px;
      padding: 10px;
    }

    audio {
      display: block;
      width: 100%;
      margin: 15px 0 25px;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <p>
    <a href="index.html">← Takaisin etusivulle</a>
  </p>

  <h1>Vaccaj – Harjoitus 1a</h1>

  <label for="aaniala">Valitse ääniala:</label>

  <select id="aaniala" onchange="vaihdaAaniala()">
    <option value="sopraano">Sopraano</option>
    <option value="mezzo">Mezzosopraano</option>
    <option value="altto">Altto</option>
    <option value="baritoni1">Baritoni 1</option>
    <option value="baritoni2">Baritoni 2</option>
  </select>

  <h2>Kuuntele äänite</h2>

  <audio
    id="soitin"
    controls
    preload="none"
    src="aanet/1a_sopraano.mp3">
    Selaimesi ei tue äänisoitinta.
  </audio>

  <h2>Nuotit</h2>

  <img
    id="nuotti"
    src="img/nuottikuvat/1a_sopraano.jpg"
    alt="Vaccaj 1a – sopraanon nuotit">

  <script>
    function vaihdaAaniala() {
      const aaniala = document.getElementById("aaniala").value;
      const nuotti = document.getElementById("nuotti");
      const soitin = document.getElementById("soitin");

      nuotti.src = "img/nuottikuvat/1a_" + aaniala + ".jpg";
      nuotti.alt = "Vaccaj 1a – " + aaniala;

      soitin.pause();
      soitin.src = "aanet/1a_" + aaniala + ".mp3";
      soitin.load();
    }
  </script>

</body>
</html>
