
<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Vaccajin laulukoulu</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 60px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #222;
    }

    h1, h2 {
      color: #285b99;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 24px;
      margin-top: 28px;
    }

    .valikko {
      background: #f1f6fb;
      border: 1px solid #d2e2f3;
      border-radius: 8px;
      padding: 24px;
      margin-top: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
      color: #285b99;
    }

    select {
      display: block;
      width: 100%;
      padding: 13px;
      font-size: 17px;
      border: 1px solid #b7cce2;
      border-radius: 6px;
      background: white;
      color: #222;
      box-sizing: border-box;
    }

    button {
      display: block;
      margin-top: 18px;
      padding: 13px 25px;
      background: #285b99;
      color: white;
      font-size: 17px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #1c4678;
    }

    button:disabled {
      background: #9aafc6;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      body {
        margin: 25px auto;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <h1>Vaccajin laulukoulu</h1>

  <p>Nicola Vaccaj – Metodo pratico di canto</p>

  <h2>Tervetuloa Vaccajin laulukouluun!</h2>

  <p>
    Valitse lauluharjoitus alla olevasta valikosta.
    Jokaisessa harjoituksessa voit valita äänialan,
    katsella nuotteja ja kuunnella äänitteen.
  </p>

  <h2>Lauluharjoitukset</h2>

  <div class="valikko">

    <label for="harjoitus">Valitse harjoitus:</label>

    <select id="harjoitus" onchange="tarkistaValinta()">
      <option value="">-- Valitse harjoitus --</option>

      <option value="1a">Harjoitus 1a</option>
      <option value="1b">Harjoitus 1b</option>

      <option value="2a">Harjoitus 2a</option>
      <option value="2b">Harjoitus 2b</option>

      <option value="3">Harjoitus 3</option>

      <option value="4a">Harjoitus 4a</option>
      <option value="4b">Harjoitus 4b</option>

      <option value="5">Harjoitus 5</option>
      <option value="6">Harjoitus 6</option>
      <option value="7">Harjoitus 7</option>

      <option value="8a">Harjoitus 8a</option>
      <option value="8b">Harjoitus 8b</option>

      <option value="9a">Harjoitus 9a</option>
      <option value="9b">Harjoitus 9b</option>

      <option value="10a">Harjoitus 10a</option>
      <option value="10b">Harjoitus 10b</option>

      <option value="11">Harjoitus 11</option>
      <option value="12">Harjoitus 12</option>

      <option value="13a">Harjoitus 13a</option>
      <option value="13b">Harjoitus 13b</option>

      <option value="14">Harjoitus 14</option>
      <option value="15">Harjoitus 15</option>
    </select>

    <button
      id="avaa"
      type="button"
      onclick="avaaHarjoitus()"
      disabled>
      Avaa harjoitus
    </button>

  </div>

  <script>
    function tarkistaValinta() {
      const harjoitus =
        document.getElementById("harjoitus").value;

      document.getElementById("avaa").disabled =
        harjoitus === "";
    }

    function avaaHarjoitus() {
      const harjoitus =
        document.getElementById("harjoitus").value;

      if (harjoitus !== "") {
        window.location.href =
          "harjoitus-" + harjoitus + ".html";
      }
    }
  </script>

</body>
</html>
