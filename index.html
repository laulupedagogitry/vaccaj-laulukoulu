
<!-- KORJATTU TEHTÄVÄVALIKKO -->

<!-- Korvaa alkuperäinen .harjoitusvalinta-CSS tällä: -->

<style>
  /* HARJOITUSVALIKKO */

  .tehtävävalinta {
    margin: 25px 0 40px;
    padding: 22px;
    background: #f1f6fb;
    border-radius: 10px;
  }

  .tehtävävalinta label {
    display: block;
    margin-bottom: 10px;
    font-weight: bold;
  }

  .tehtävävalinta select {
    display: block;
    width: 100%;
    max-width: 100%;
    padding: 12px;
    font-size: 15px;
    border: 1px solid #b7cce2;
    border-radius: 6px;
    background: white;
    cursor: pointer;
  }
</style>

<!-- Säilytä nykyinen tehtävävalikko ja kaikki sen option-rivit.
     Korjaa vain labelin for ja selectin onchange seuraavasti: -->

<div class="tehtävävalinta">

  <label for="harjoitus">
    Valitse tehtävä:
  </label>

  <select
    id="harjoitus"
    onchange="vaihdaHarjoitus()">

    <!-- Säilytä kaikki nykyiset optgroup- ja option-rivit tässä. -->

  </select>

</div>

<!-- Säilytä alkuperäinen JavaScript-funktio muuttamattomana: -->

<script>
  function vaihdaHarjoitus() {
    const harjoitus =
      document.getElementById("harjoitus").value;

    if (harjoitus !== "") {
      window.location.href =
        "harjoitus-" + harjoitus + ".html";
    }
  }
</script>
